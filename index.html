<!DOCTYPE html>
<html>
<head>
    <title>Riddhi & Roshan Tours and Travels</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        /* Top Header */
        .header {
            background: #123c69;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 38px;
        }

        .header p {
            margin-top: 10px;
            font-size: 18px;
        }

        /* Services */
        .services {
            text-align: center;
            padding: 25px;
        }

        .service-box {
            display: inline-block;
            background: white;
            width: 180px;
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #cccccc;
        }

        /* Enquiry Box */
        .enquiry-box {
            width: 400px;
            max-width: 85%;
            margin: 20px auto 50px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px #cccccc;
            text-align: center;
        }

        .enquiry-box h2 {
            margin-top: 0;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 7px;
            font-size: 16px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 90%;
            padding: 14px;
            margin-top: 12px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1ebe5d;
        }

        .footer {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Riddhi & Roshan Tours and Travels</h1>
        <p>Your Journey, Our Responsibility</p>
    </div>

    <div class="services">

        <h2>Our Services</h2>

        <div class="service-box">
            <h3>✈️ Flights</h3>
            <p>Domestic & International</p>
        </div>

        <div class="service-box">
            <h3>🚆 Railway</h3>
            <p>Rail Ticket Assistance</p>
        </div>

        <div class="service-box">
            <h3>🚌 Bus</h3>
            <p>Bus Ticket Booking</p>
        </div>

        <div class="service-box">
            <h3>🏖️ Holidays</h3>
            <p>Tour Packages</p>
        </div>

    </div>

    <div class="enquiry-box">

        <h2>Travel Enquiry</h2>

        <form onsubmit="sendWhatsApp(); return false;">

            <input type="text" id="name"
                   placeholder="Customer Name" required>

            <input type="tel" id="mobile"
                   placeholder="Mobile Number" required>

            <select id="service" required>
                <option value="">Select Service</option>
                <option value="Flight">Flight</option>
                <option value="Railway">Railway</option>
                <option value="Bus">Bus</option>
                <option value="Holiday Package">Holiday Package</option>
            </select>

            <input type="text" id="from"
                   placeholder="From" required>

            <input type="text" id="to"
                   placeholder="To" required>

            <input type="date" id="date" required>

            <button type="submit">
                Send Enquiry on WhatsApp
            </button>

        </form>

    </div>

    <div class="footer">
        © 2026 Riddhi & Roshan Tours and Travels
    </div>


    <script>
        function sendWhatsApp() {

            var name = document.getElementById("name").value;
            var mobile = document.getElementById("mobile").value;
            var service = document.getElementById("service").value;
            var from = document.getElementById("from").value;
            var to = document.getElementById("to").value;
            var date = document.getElementById("date").value;

            var message =
                "New Travel Enquiry\n\n" +
                "Customer Name: " + name + "\n" +
                "Mobile: " + mobile + "\n" +
                "Service: " + service + "\n" +
                "From: " + from + "\n" +
                "To: " + to + "\n" +
                "Travel Date: " + date;

            var whatsappURL =
                "https://wa.me/919967317329?text=" +
                encodeURIComponent(message);
